<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --primary: #2563eb;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: #e5e7eb;
      --badge-bg: #e0e7ff;
      --badge-text: #1d4ed8;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #60a5fa;
      --accent: #34d399;
      --danger: #f87171;
      --border: #1f2937;
      --badge-bg: #1f2937;
      --badge-text: #93c5fd;
      --shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 2;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button, .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 600;
    }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.ghost { background: transparent; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
    .tabs { display: flex; gap: 8px; padding: 12px 20px; }
    .tab { padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; border: 1px solid var(--border); }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .panel { padding: 16px 20px 40px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .space { flex: 1; }
    .badge { padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: var(--badge-bg); color: var(--badge-text); }
    .lang { padding: 4px 8px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border); }
    .status-NEW { background: #e0f2fe; color: #0369a1; }
    .status-FETCHED { background: #dbeafe; color: #1d4ed8; }
    .status-READY { background: #dcfce7; color: #15803d; }
    .status-IN_PROGRESS { background: #fef9c3; color: #854d0e; }
    .status-DONE { background: #d1fae5; color: #065f46; }
    .status-ERROR { background: #fee2e2; color: #991b1b; }
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 100%;
      font-size: 14px;
    }
    textarea { min-height: 80px; }
    .section-title { font-size: 14px; font-weight: 700; margin: 12px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .text-muted { color: var(--muted); font-size: 13px; }
    .toast-container { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .toast { padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow); color: #fff; font-weight: 600; }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #2563eb; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; }
    .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .small-btn { padding: 6px 10px; font-size: 12px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--muted); font-weight: 700; }
    .view-toggle { display: flex; gap: 6px; }
    .status-select { width: 150px; }
    .loading { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="toast-container" id="toasts"></div>
  <header>
    <div class="row">
      <h1>Translation Manager</h1>
    </div>
    <div class="actions">
      <label class="pill" id="themeToggle">
        <input type="checkbox" style="display:none">
        <span>🌗 Theme</span>
      </label>
      <button class="ghost" id="setupBtn">Setup</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="queue">Queue</div>
    <div class="tab" data-tab="settings">Settings</div>
    <div class="tab" data-tab="logs">Logs</div>
  </div>

  <div class="panel" id="queueTab">
    <div class="card" style="margin-bottom:12px;">
      <div class="section-title">Add URL</div>
      <div class="input-group">
        <input type="text" id="urlInput" placeholder="Paste YouTube link" />
        <button class="primary" id="addBtn">Add</button>
      </div>
      <div class="toolbar">
        <div class="view-toggle">
          <button class="small-btn" data-view="table">Table</button>
          <button class="small-btn" data-view="cards">Cards</button>
        </div>
        <select id="statusFilter" class="status-select">
          <option value="">All statuses</option>
        </select>
        <input type="text" id="searchInput" placeholder="Search title/url/channel" style="max-width:260px;" />
        <button class="ghost small-btn" id="refreshQueue">Refresh</button>
      </div>
      <div class="section-title">Queue</div>
      <div id="queueContainer"></div>
    </div>
  </div>

  <div class="panel" id="settingsTab" style="display:none;">
    <div class="card">
      <div class="section-title">Languages (select up to 10)</div>
      <div class="toolbar" id="languageChips"></div>
      <div class="section-title">Theme</div>
      <div class="toolbar">
        <button class="small-btn" data-theme="light">Light</button>
        <button class="small-btn" data-theme="dark">Dark</button>
      </div>
      <button class="primary" id="saveSettingsBtn">Confirm selection</button>
    </div>
  </div>

  <div class="panel" id="logsTab" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <select id="logLevel">
          <option value="">All levels</option>
          <option value="INFO">INFO</option>
          <option value="WARN">WARN</option>
          <option value="ERROR">ERROR</option>
        </select>
        <button class="ghost small-btn" id="refreshLogs">Refresh</button>
      </div>
      <div class="section-title">Recent logs</div>
      <div id="logsContainer"></div>
    </div>
  </div>

  <script>
    const STATUS_VALUES = ['NEW', 'FETCHED', 'READY', 'IN_PROGRESS', 'DONE', 'ERROR'];
    const LANG_OPTIONS = ['EN','ES','FR','DE','IT','PT','PL','UK','RU','TR'];
    const state = {
      settings: { selectedLanguages: [], theme: 'light' },
      queue: [],
      logs: [],
      viewMode: 'table',
      filters: { status: '', search: '' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      initTabs();
      initControls();
      bootstrap();
    });

    function initTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const target = tab.dataset.tab;
          ['queue','settings','logs'].forEach(id => {
            document.getElementById(id + 'Tab').style.display = id === target ? 'block' : 'none';
          });
        });
      });
    }

    function initControls() {
      document.getElementById('addBtn').addEventListener('click', addQueueItem);
      document.getElementById('refreshQueue').addEventListener('click', loadQueue);
      document.getElementById('refreshLogs').addEventListener('click', loadLogs);
      document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
      document.getElementById('setupBtn').addEventListener('click', runSetup);
      document.getElementById('statusFilter').addEventListener('change', (e) => {
        state.filters.status = e.target.value;
        loadQueue();
      });
      document.getElementById('searchInput').addEventListener('input', debounce(() => {
        state.filters.search = document.getElementById('searchInput').value.trim();
        loadQueue();
      }, 350));
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.viewMode = btn.dataset.view;
          renderQueue();
        });
      });
      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.addEventListener('click', () => {
          const theme = btn.dataset.theme;
          applyTheme(theme);
          saveSettings();
        });
      });
      document.getElementById('logLevel').addEventListener('change', loadLogs);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      const statusFilter = document.getElementById('statusFilter');
      STATUS_VALUES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        statusFilter.appendChild(opt);
      });
      renderLanguageChips();
    }

    function bootstrap() {
      loading(true);
      google.script.run.withSuccessHandler(data => {
        state.settings = data.settings || state.settings;
        state.queue = data.recentQueue || [];
        state.logs = data.recentLogs || [];
        applyTheme(state.settings.theme);
        renderLanguageChips();
        renderQueue();
        renderLogs();
        updateAddAvailability();
        loading(false);
      }).withFailureHandler(errToast).getBootstrap();
    }

    function renderLanguageChips() {
      const container = document.getElementById('languageChips');
      container.innerHTML = '';
      LANG_OPTIONS.forEach(code => {
        const chip = document.createElement('div');
        chip.className = 'pill' + (state.settings.selectedLanguages.includes(code) ? ' active' : '');
        chip.textContent = code;
        chip.addEventListener('click', () => {
          toggleLang(code);
        });
        container.appendChild(chip);
      });
    }

    function toggleLang(code) {
      const idx = state.settings.selectedLanguages.indexOf(code);
      if (idx >= 0) {
        state.settings.selectedLanguages.splice(idx,1);
      } else {
        if (state.settings.selectedLanguages.length >= 10) {
          showToast('Select up to 10 languages', 'error');
          return;
        }
        state.settings.selectedLanguages.push(code);
      }
      renderLanguageChips();
      updateAddAvailability();
    }

    function updateAddAvailability() {
      document.getElementById('addBtn').disabled = state.settings.selectedLanguages.length === 0;
    }

    function saveSettings() {
      loading(true);
      google.script.run.withSuccessHandler(res => {
        state.settings = res;
        applyTheme(res.theme);
        renderLanguageChips();
        updateAddAvailability();
        showToast('Settings saved', 'success');
        loading(false);
      }).withFailureHandler(errToast).saveSettings({
        selectedLanguages: state.settings.selectedLanguages,
        theme: state.settings.theme
      });
    }

    function applyTheme(theme) {
      state.settings.theme = theme === 'dark' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', state.settings.theme);
    }

    function toggleTheme() {
      const next = state.settings.theme === 'dark' ? 'light' : 'dark';
      state.settings.theme = next;
      applyTheme(next);
      saveSettings();
    }

    function addQueueItem() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) {
        showToast('URL is required', 'error');
        return;
      }
      loading(true);
      google.script.run.withSuccessHandler(item => {
        showToast('Added to queue', 'success');
        document.getElementById('urlInput').value = '';
        loadQueue();
        loadLogs();
        loading(false);
      }).withFailureHandler(errToast).addQueueItem({ sourceUrl: url });
    }

    function loadQueue() {
      loading(true);
      google.script.run.withSuccessHandler(items => {
        state.queue = items || [];
        renderQueue();
        loading(false);
      }).withFailureHandler(errToast).listQueue({
        status: state.filters.status,
        search: state.filters.search,
        limit: 200,
        offset: 0,
        sort: 'createdAt:desc'
      });
    }

    function renderQueue() {
      const container = document.getElementById('queueContainer');
      if (!state.queue.length) {
        container.innerHTML = '<div class="text-muted">No items yet</div>';
        return;
      }
      if (state.viewMode === 'cards') {
        const grid = document.createElement('div');
        grid.className = 'grid';
        state.queue.forEach(item => {
          grid.appendChild(renderCard(item));
        });
        container.innerHTML = '';
        container.appendChild(grid);
      } else {
        container.innerHTML = renderTable(state.queue);
      }
    }

    function renderCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row">
          <div>
            <div style="font-weight:700;">${escapeHtml(item.title || 'Untitled')}</div>
            <div class="text-muted">${escapeHtml(item.channelTitle || 'Unknown')}</div>
            <div class="text-muted">${formatDate(item.createdAt)}</div>
          </div>
          <div class="space"></div>
          <span class="badge status-${item.status}">${item.status}</span>
        </div>
        <div class="toolbar" style="margin-top:10px;">
          ${renderLangBadges(item.requestedLangs)}
        </div>
        <div class="toolbar">
          <button class="small-btn ghost" onclick="openUrl('${encodeURIComponent(item.sourceUrl)}')">Open</button>
          <button class="small-btn" onclick="editPriority('${item.id}', ${item.priority || 0})">Priority: ${item.priority || 0}</button>
          <select class="small-btn" onchange="changeStatus('${item.id}', this.value)">
            ${STATUS_VALUES.map(s => `<option value="${s}" ${s===item.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <button class="small-btn ghost" onclick="editNotes('${item.id}', ${JSON.stringify(item.notes || '').replace(/"/g,'&quot;')})">Notes</button>
          <button class="small-btn ghost" onclick="retryMeta('${item.id}')">Refetch</button>
        </div>
      `;
      return card;
    }

    function renderTable(items) {
      let html = '<table><thead><tr>' +
        '<th>Title</th><th>Channel</th><th>Created</th><th>Status</th><th>Langs</th><th>Priority</th><th>Actions</th>' +
        '</tr></thead><tbody>';
      items.forEach(item => {
        html += `<tr>
          <td>${escapeHtml(item.title || 'Untitled')}<div class="text-muted">${escapeHtml(item.sourceUrl)}</div></td>
          <td>${escapeHtml(item.channelTitle || 'Unknown')}</td>
          <td>${formatDate(item.createdAt)}</td>
          <td><span class="badge status-${item.status}">${item.status}</span></td>
          <td>${renderLangBadges(item.requestedLangs)}</td>
          <td>${item.priority || 0}</td>
          <td>
            <div class="toolbar">
              <button class="small-btn ghost" onclick="openUrl('${encodeURIComponent(item.sourceUrl)}')">Open</button>
              <button class="small-btn" onclick="editPriority('${item.id}', ${item.priority || 0})">Priority</button>
              <select class="small-btn" onchange="changeStatus('${item.id}', this.value)">
                ${STATUS_VALUES.map(s => `<option value="${s}" ${s===item.status?'selected':''}>${s}</option>`).join('')}
              </select>
              <button class="small-btn ghost" onclick="editNotes('${item.id}', ${JSON.stringify(item.notes || '').replace(/"/g,'&quot;')})">Notes</button>
              <button class="small-btn ghost" onclick="retryMeta('${item.id}')">Refetch</button>
            </div>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      return html;
    }

    function renderLangBadges(arr) {
      if (!Array.isArray(arr) || !arr.length) return '<span class="text-muted">-</span>';
      return arr.map(l => `<span class="lang">${l}</span>`).join(' ');
    }

    function openUrl(url) {
      const decoded = decodeURIComponent(url);
      window.open(decoded, '_blank');
    }

    function editPriority(id, current) {
      const value = prompt('Set priority (number)', current);
      if (value === null) return;
      const num = Number(value);
      if (isNaN(num)) {
        showToast('Invalid priority', 'error');
        return;
      }
      loading(true);
      google.script.run.withSuccessHandler(item => {
        showToast('Priority updated', 'success');
        loadQueue();
        loadLogs();
        loading(false);
      }).withFailureHandler(errToast).updateQueueItem({ id, patch: { priority: num } });
    }

    function changeStatus(id, status) {
      loading(true);
      google.script.run.withSuccessHandler(item => {
        showToast('Status updated', 'success');
        loadQueue();
        loadLogs();
        loading(false);
      }).withFailureHandler(errToast).updateQueueItem({ id, patch: { status } });
    }

    function editNotes(id, current) {
      const value = prompt('Notes', current || '');
      if (value === null) return;
      loading(true);
      google.script.run.withSuccessHandler(item => {
        showToast('Notes updated', 'success');
        loadQueue();
        loading(false);
      }).withFailureHandler(errToast).updateQueueItem({ id, patch: { notes: value } });
    }

    function retryMeta(id) {
      loading(true);
      google.script.run.withSuccessHandler(item => {
        showToast('Metadata refreshed', 'success');
        loadQueue();
        loadLogs();
        loading(false);
      }).withFailureHandler(errToast).refetchMetadata({ id });
    }

    function loadLogs() {
      loading(true);
      google.script.run.withSuccessHandler(logs => {
        state.logs = logs || [];
        renderLogs();
        loading(false);
      }).withFailureHandler(errToast).listLogs({ level: document.getElementById('logLevel').value, limit: 200 });
    }

    function renderLogs() {
      const container = document.getElementById('logsContainer');
      if (!state.logs.length) {
        container.innerHTML = '<div class="text-muted">No logs</div>';
        return;
      }
      let html = '<table><thead><tr><th>Time</th><th>Level</th><th>Action</th><th>Details</th><th>Queue ID</th></tr></thead><tbody>';
      state.logs.forEach(log => {
        html += `<tr>
          <td>${formatDate(log.ts)}</td>
          <td>${log.level}</td>
          <td>${escapeHtml(log.action || '')}</td>
          <td>${escapeHtml(log.details || '')}</td>
          <td>${escapeHtml(log.queueId || '')}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function runSetup() {
      if (!confirm('Run setup? This ensures sheets exist.')) return;
      loading(true);
      google.script.run.withSuccessHandler(() => {
        showToast('Setup complete', 'success');
        bootstrap();
        loading(false);
      }).withFailureHandler(errToast).setupProject();
    }

    function showToast(message, type='info') {
      const container = document.getElementById('toasts');
      const div = document.createElement('div');
      div.className = 'toast ' + type;
      div.textContent = message;
      container.appendChild(div);
      setTimeout(() => { div.remove(); }, 3500);
    }

    function errToast(err) {
      console.error(err);
      showToast(err && err.message ? err.message : 'Error', 'error');
      loading(false);
    }

    function formatDate(value) {
      if (!value) return '';
      try {
        const d = new Date(value);
        return d.toLocaleString();
      } catch (e) { return value; }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }

    function debounce(fn, wait) {
      let t;
      return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      }
    }

    function loading(flag) {
      document.body.classList.toggle('loading', !!flag);
    }
  </script>
</body>
</html>
