<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Translation Workflow</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #111;
      --muted: #666;
      --border: #e1e1e1;
      --accent: #2f6df2;
      --badge: #f0f0f0;
      --badge-border: #d0d0d0;
      --table-hover: #f2f4f7;
    }

    :root[data-theme="dark"] {
      --bg: #0f1115;
      --card: #151821;
      --text: #f5f5f5;
      --muted: #a5a5a5;
      --border: #272a33;
      --accent: #6da3ff;
      --badge: #1f2330;
      --badge-border: #353a46;
      --table-hover: #1c2030;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .nav {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      margin-bottom: 16px;
    }

    .nav button {
      background: none;
      border: none;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .nav button.active { border-color: var(--accent); color: var(--accent); }
    .nav button:hover { background: var(--table-hover); }

    h2 { margin: 0 0 12px 0; font-size: 18px; }
    p { color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card);
      color: var(--text);
    }

    .btn {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }

    .btn.primary { border-color: var(--accent); color: var(--accent); }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
    tr:hover td { background: var(--table-hover); }
    tr.details td { background: var(--card); }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--badge-border);
      background: var(--badge);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text);
    }
    .badge.filled { background: var(--accent); color: #fff; border-color: var(--accent); }

    .accordion { border-top: 1px solid var(--border); padding: 12px; background: var(--table-hover); }
    .muted { color: var(--muted); font-size: 12px; }

    .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .divider { border-top: 1px solid var(--border); margin: 16px 0; }

    .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    @media (max-width: 720px) {
      .nav { flex-wrap: wrap; }
      .nav button { flex: 1 1 45%; text-align: left; }
      th, td { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav" id="nav"></div>

    <section id="tab-control" class="tab">
      <div class="card">
        <div class="flex-between">
          <h2>Control Panel</h2>
          <div class="form-group" style="margin:0">
            <label>Theme</label>
            <select id="theme-select">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
        <p>Select languages before adding items to the queue.</p>
        <div class="split" id="language-list"></div>
        <div class="divider"></div>
        <button class="btn primary" id="save-settings">Save Settings</button>
        <span id="settings-status" class="muted"></span>
      </div>
    </section>

    <section id="tab-add" class="tab" hidden>
      <div class="card">
        <h2>Add to Queue</h2>
        <div class="form-group">
          <label for="queue-url">YouTube URL</label>
          <input type="url" id="queue-url" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <button class="btn primary" id="btn-add-queue">Add to Queue</button>
        <span class="muted" id="add-queue-status"></span>
      </div>
    </section>

    <section id="tab-queue" class="tab" hidden>
      <div class="card">
        <h2>Queue</h2>
        <div class="table-wrapper">
          <table id="queue-table">
            <thead>
              <tr>
                <th>Video URL</th>
                <th>Languages</th>
                <th>Status</th>
                <th>Progress</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-publish" class="tab" hidden>
      <div class="card">
        <h2>Publish Translation</h2>
        <div class="form-group">
          <label for="publish-queue">Queue Item</label>
          <select id="publish-queue"></select>
        </div>
        <div class="form-group">
          <label for="publish-language">Language</label>
          <select id="publish-language"></select>
        </div>
        <div class="form-group">
          <label for="publish-url">Published URL</label>
          <input type="url" id="publish-url" />
        </div>
        <div class="split">
          <div class="form-group">
            <label for="publish-channel">Channel Name</label>
            <input type="text" id="publish-channel" />
          </div>
          <div class="form-group">
            <label for="publish-voice">Voice Name</label>
            <input type="text" id="publish-voice" />
          </div>
        </div>
        <div class="form-group">
          <label for="publish-notes">Notes</label>
          <textarea id="publish-notes" rows="3"></textarea>
        </div>
        <button class="btn primary" id="btn-add-published">Add Published</button>
        <span class="muted" id="publish-status"></span>
      </div>
    </section>

    <section id="tab-history" class="tab" hidden>
      <div class="card">
        <h2>History</h2>
        <table id="history-table">
          <thead>
            <tr>
              <th>Published URL</th>
              <th>Language</th>
              <th>Channel</th>
              <th>Voice</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-logs" class="tab" hidden>
      <div class="card">
        <h2>Logs</h2>
        <table id="logs-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Level</th>
              <th>Action</th>
              <th>Entity</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-stats" class="tab" hidden>
      <div class="card">
        <h2>Stats</h2>
        <div id="stats-cards" class="split"></div>
      </div>
    </section>
  </div>

  <script>
    const state = {
      settings: { selectedLanguages: [], theme: 'light' },
      queue: [],
      published: [],
      logs: [],
      stats: {},
      navTabs: [
        { id: 'control', label: 'Control Panel' },
        { id: 'add', label: 'Add to Queue' },
        { id: 'queue', label: 'Queue' },
        { id: 'publish', label: 'Publish' },
        { id: 'history', label: 'History' },
        { id: 'logs', label: 'Logs' },
        { id: 'stats', label: 'Stats' },
      ],
    };

    function initNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = '';
      state.navTabs.forEach((tab, index) => {
        const btn = document.createElement('button');
        btn.textContent = tab.label;
        btn.dataset.target = tab.id;
        btn.className = index === 0 ? 'active' : '';
        btn.onclick = () => switchTab(tab.id, btn);
        nav.appendChild(btn);
      });
    }

    function switchTab(id, btn) {
      document.querySelectorAll('.tab').forEach(sec => {
        sec.hidden = !sec.id.endsWith(id);
      });
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (id === 'publish') updatePublishSelectors();
    }

    const AVAILABLE_LANGUAGES = <?!= JSON.stringify(languages) ?>;

    function renderLanguages() {
      const wrap = document.getElementById('language-list');
      wrap.innerHTML = '';
      (AVAILABLE_LANGUAGES || []).forEach(lang => {
        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.gap = '8px';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = lang.code;
        checkbox.checked = state.settings.selectedLanguages.includes(lang.code);
        checkbox.onchange = () => {
          if (checkbox.checked) {
            state.settings.selectedLanguages.push(lang.code);
          } else {
            state.settings.selectedLanguages = state.settings.selectedLanguages.filter(c => c !== lang.code);
          }
        };
        const text = document.createElement('span');
        text.textContent = `${lang.label} (${lang.code.toUpperCase()})`;
        label.appendChild(checkbox);
        label.appendChild(text);
        wrap.appendChild(label);
      });
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-select').value = theme;
    }

    function saveSettings() {
      const theme = document.getElementById('theme-select').value;
      const statusEl = document.getElementById('settings-status');
      statusEl.textContent = 'Saving...';
      google.script.run
        .withSuccessHandler(res => {
          if (res.ok) {
            state.settings = res.data;
            applyTheme(res.data.theme);
            statusEl.textContent = 'Saved';
            renderLanguages();
          } else {
            statusEl.textContent = res.error;
          }
        })
        .withFailureHandler(err => statusEl.textContent = err.message || err)
        .apiSaveSettings({
          selectedLanguages: state.settings.selectedLanguages,
          theme,
        });
    }

    function loadSettings() {
      google.script.run
        .withSuccessHandler(res => {
          if (res.ok) {
            state.settings = res.data;
            applyTheme(res.data.theme);
            renderLanguages();
          }
        })
        .apiGetSettings();
    }

    function addToQueue() {
      const urlInput = document.getElementById('queue-url');
      const statusEl = document.getElementById('add-queue-status');
      statusEl.textContent = 'Adding...';
      google.script.run
        .withSuccessHandler(res => {
          if (res.ok) {
            urlInput.value = '';
            statusEl.textContent = 'Added';
            loadQueue();
          } else {
            statusEl.textContent = res.error;
          }
        })
        .withFailureHandler(err => statusEl.textContent = err.message || err)
        .apiAddQueue({ sourceUrl: urlInput.value });
    }

    function buildBadge(code, filled) {
      const span = document.createElement('span');
      span.className = 'badge' + (filled ? ' filled' : '');
      span.textContent = code.toUpperCase();
      return span;
    }

    function renderQueue() {
      const tbody = document.querySelector('#queue-table tbody');
      tbody.innerHTML = '';
      const publishedMap = groupPublishedByQueue();
      state.queue.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'clickable';
        row.onclick = () => toggleAccordion(tbody, row, renderQueueDetails(item));

        const urlCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = item.sourceUrl;
        link.textContent = 'Open video';
        link.target = '_blank';
        urlCell.appendChild(link);
        row.appendChild(urlCell);

        const langCell = document.createElement('td');
        const badges = document.createElement('div');
        badges.className = 'badges';
        const completed = new Set((publishedMap[item.id] || []).map(p => p.language));
        item.languages.forEach(code => badges.appendChild(buildBadge(code, completed.has(code))));
        langCell.appendChild(badges);
        row.appendChild(langCell);

        const statusCell = document.createElement('td');
        statusCell.textContent = item.status;
        row.appendChild(statusCell);

        const progressCell = document.createElement('td');
        progressCell.textContent = `${item.progress || 0}%`;
        row.appendChild(progressCell);

        const actionsCell = document.createElement('td');
        actionsCell.appendChild(makeActionButton('Start', () => startQueue(item.id), item.status !== 'NEW'));
        actionsCell.appendChild(makeActionButton('Cancel', () => cancelQueue(item.id), item.status === 'CANCELED' || item.status === 'DONE'));
        actionsCell.appendChild(makeActionButton('Refresh', () => refreshQueue(item.id), item.status === 'CANCELED'));
        actionsCell.style.display = 'flex';
        actionsCell.style.gap = '6px';
        row.appendChild(actionsCell);

        tbody.appendChild(row);
      });
    }

    function renderQueueDetails(item) {
      return () => {
        const div = document.createElement('div');
        div.className = 'accordion';
        div.innerHTML = `
          <div class="split">
            <div><strong>Title:</strong> ${item.yt_title || ''}</div>
            <div><strong>Channel:</strong> ${item.yt_channelTitle || ''}</div>
            <div><strong>Duration:</strong> ${item.yt_duration || ''}</div>
          </div>
          <div class="divider"></div>
          <div><strong>Description</strong><div style="max-height:120px; overflow:auto; white-space:pre-wrap">${(item.yt_description || '').replace(/</g,'&lt;')}</div></div>
          <div class="divider"></div>
          <div><strong>Tags:</strong> ${(item.yt_tags || '')}</div>
        `;
        return div;
      };
    }

    function makeActionButton(label, handler, disabled) {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = label;
      btn.disabled = !!disabled;
      btn.onclick = (e) => { e.stopPropagation(); handler(); };
      return btn;
    }

    function toggleAccordion(tbody, row, contentBuilder) {
      const open = tbody.querySelector('tr.details');
      if (open && open.previousSibling === row) {
        open.remove();
        return;
      }
      if (open) open.remove();
      const detailsRow = document.createElement('tr');
      detailsRow.className = 'details';
      const cell = document.createElement('td');
      cell.colSpan = row.cells.length;
      cell.appendChild(contentBuilder());
      detailsRow.appendChild(cell);
      row.after(detailsRow);
    }

    function startQueue(id) {
      google.script.run.withSuccessHandler(res => { if (res.ok) loadQueue(); }).apiStartQueue({ id });
    }

    function cancelQueue(id) {
      google.script.run.withSuccessHandler(res => { if (res.ok) loadQueue(); }).apiCancelQueue({ id });
    }

    function refreshQueue(id) {
      google.script.run.withSuccessHandler(res => { if (res.ok) loadQueue(); }).apiRefreshQueue({ id });
    }

    function loadQueue() {
      google.script.run.withSuccessHandler(res => {
        if (res.ok) {
          state.queue = res.data;
          renderQueue();
          updatePublishSelectors();
          renderStats();
          loadStats();
        }
      }).apiGetQueue();
    }

    function loadPublished() {
      google.script.run.withSuccessHandler(res => {
        if (res.ok) {
          state.published = res.data;
          renderHistory();
          renderQueue();
          updatePublishSelectors();
          renderStats();
          loadStats();
        }
      }).apiGetPublished();
    }

    function updatePublishSelectors() {
      const selectQueue = document.getElementById('publish-queue');
      selectQueue.innerHTML = '';
      state.queue.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = `${item.yt_title || 'Untitled'} (${item.status})`;
        selectQueue.appendChild(opt);
      });
      updateLanguageSelector();
    }

    function updateLanguageSelector() {
      const queueId = document.getElementById('publish-queue').value;
      const selectLang = document.getElementById('publish-language');
      selectLang.innerHTML = '';
      const queueItem = state.queue.find(q => q.id === queueId);
      if (!queueItem) return;
      const publishedForQueue = state.published.filter(p => p.sourceQueueId === queueId).map(p => p.language);
      queueItem.languages
        .filter(code => !publishedForQueue.includes(code))
        .forEach(code => {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code.toUpperCase();
          selectLang.appendChild(opt);
        });
    }

    function addPublished() {
      const queueId = document.getElementById('publish-queue').value;
      const language = document.getElementById('publish-language').value;
      const payload = {
        queueId,
        language,
        publishedUrl: document.getElementById('publish-url').value,
        channelName: document.getElementById('publish-channel').value,
        voiceName: document.getElementById('publish-voice').value,
        notes: document.getElementById('publish-notes').value,
      };
      const statusEl = document.getElementById('publish-status');
      statusEl.textContent = 'Saving...';
      google.script.run
        .withSuccessHandler(res => {
          if (res.ok) {
            statusEl.textContent = 'Saved';
            document.getElementById('publish-url').value = '';
            document.getElementById('publish-channel').value = '';
            document.getElementById('publish-voice').value = '';
            document.getElementById('publish-notes').value = '';
            loadPublished();
          } else {
            statusEl.textContent = res.error;
          }
        })
        .withFailureHandler(err => statusEl.textContent = err.message || err)
        .apiAddPublished(payload);
    }

    function renderHistory() {
      const tbody = document.querySelector('#history-table tbody');
      tbody.innerHTML = '';
      state.published.forEach(item => {
        const row = document.createElement('tr');
        row.onclick = () => toggleAccordion(tbody, row, () => buildHistoryDetails(item));

        const urlCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = item.publishedUrl;
        link.textContent = 'Published link';
        link.target = '_blank';
        urlCell.appendChild(link);
        row.appendChild(urlCell);

        const langCell = document.createElement('td');
        langCell.appendChild(buildBadge(item.language, true));
        row.appendChild(langCell);

        const channelCell = document.createElement('td');
        channelCell.textContent = item.channelName || '';
        row.appendChild(channelCell);

        const voiceCell = document.createElement('td');
        voiceCell.textContent = item.voiceName || '';
        row.appendChild(voiceCell);

        const dateCell = document.createElement('td');
        dateCell.textContent = item.createdAt || '';
        row.appendChild(dateCell);

        tbody.appendChild(row);
      });
    }

    function buildHistoryDetails(item) {
      const div = document.createElement('div');
      div.className = 'accordion';
      const originalUrl = item.sourceVideoId ? `https://youtu.be/${item.sourceVideoId}` : '';
      div.innerHTML = `
        <div class="split">
          <div><strong>Original:</strong> <a href="${originalUrl}" target="_blank">${originalUrl}</a></div>
          <div><strong>Language:</strong> ${item.language.toUpperCase()}</div>
          <div><strong>Channel:</strong> ${item.channelName || ''}</div>
          <div><strong>Voice:</strong> ${item.voiceName || ''}</div>
        </div>
        <div class="divider"></div>
        <div><strong>Title:</strong> ${item.yt_title || ''}</div>
        <div><strong>Description:</strong><div style="white-space:pre-wrap; max-height:120px; overflow:auto;">${(item.yt_description || '').replace(/</g,'&lt;')}</div></div>
      `;
      return div;
    }

    function toggleTabVisibility() {
      document.querySelectorAll('#publish-queue, #publish-language').forEach(el => el.onchange = updateLanguageSelector);
    }

    function groupPublishedByQueue() {
      return state.published.reduce((acc, item) => {
        acc[item.sourceQueueId] = acc[item.sourceQueueId] || [];
        acc[item.sourceQueueId].push(item);
        return acc;
      }, {});
    }

    function loadLogs() {
      if (!google.script.run.apiGetLogs) return;
      google.script.run.withSuccessHandler(res => {
        if (res.ok) {
          state.logs = res.data;
          renderLogs();
        }
      }).apiGetLogs();
    }

    function renderLogs() {
      const tbody = document.querySelector('#logs-table tbody');
      tbody.innerHTML = '';
      state.logs.forEach(entry => {
        const row = document.createElement('tr');
        row.onclick = () => toggleAccordion(tbody, row, () => buildLogDetails(entry));
        row.innerHTML = `
          <td>${entry.timestamp}</td>
          <td>${entry.level}</td>
          <td>${entry.action}</td>
          <td>${entry.entityType || ''}</td>
          <td>${entry.message || ''}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function buildLogDetails(entry) {
      const div = document.createElement('div');
      div.className = 'accordion';
      div.innerHTML = `
        <div><strong>Entity ID:</strong> ${entry.entityId || ''}</div>
        <div class="divider"></div>
        <div><strong>Details:</strong><div style="white-space:pre-wrap">${entry.details || ''}</div></div>
      `;
      return div;
    }

    function renderStats() {
      const wrap = document.getElementById('stats-cards');
      wrap.innerHTML = '';
      const stats = state.stats || {};
      const cards = [
        { label: 'Queue Items', value: stats.queueCount ?? state.queue.length },
        { label: 'Published', value: stats.publishedCount ?? state.published.length },
        { label: 'Completed', value: stats.doneCount ?? 0 },
        { label: 'Selected Languages', value: state.settings.selectedLanguages.length },
      ];
      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<h3 style="margin:0 0 6px 0">${card.value}</h3><div class="muted">${card.label}</div>`;
        wrap.appendChild(div);
      });
    }

    function loadStats() {
      google.script.run.withSuccessHandler(res => {
        if (res.ok) {
          state.stats = res.data;
          renderStats();
        }
      }).apiGetStats();
    }

    function init() {
      initNav();
      toggleTabVisibility();
      document.getElementById('save-settings').onclick = saveSettings;
      document.getElementById('btn-add-queue').onclick = addToQueue;
      document.getElementById('btn-add-published').onclick = addPublished;
      document.getElementById('publish-queue').onchange = updateLanguageSelector;
      loadSettings();
      loadQueue();
      loadPublished();
      loadLogs();
      loadStats();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
