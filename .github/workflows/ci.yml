name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  verify-deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Verify build output
        run: |
          npm ci
          npm run build
          if [ ! -d "dist/public" ]; then
            echo "Error: dist/public directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/public/index.html" ]; then
            echo "Error: dist/public/index.html not found"
            exit 1
          fi
          echo "Build output verified successfully"
